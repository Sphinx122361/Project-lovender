<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#E6E0F8">
    <title>Project Lavender - Welcome</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design.css">
</head>
<body class="welcome-body">

    <main class="welcome">
        <p class="welcome-eyebrow">WELCOME TO</p>

        <div class="welcome-title">
            <img src="flower lugo for user.png" alt="Project Lavender logo">
            <h1>PROJECT LAVENDER</h1>
        </div>

        <p class="welcome-subtitle">
            Student Printing &amp; Photocopy Ordering System
        </p>

        <form id="welcomeForm" class="name-input">
            <label for="name">What is your name?</label>

            <div class="input-box">
                <img src="Login design lugo.png" alt="">
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    maxlength="100"
                    required
                >
            </div>

            <button type="submit" class="continue-btn">
                Continue
            </button>
        </form>
    </main>

    <script src="main.js" defer></script>
</body>
</html>
